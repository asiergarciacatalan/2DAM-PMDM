<h4>Ejercicio 1</h4>
<p>Crea una función llamada sumar que reciba dos números y devuelva su suma.</p>

<div class="mb-3 mt-3">
  <label for="" class="form-label">Número 1:</label>
  <input type="number" [(ngModel)]="num1" class="form-control" placeholder="Introducir número 1">
</div>

<div class="mb-3 mt-3">
  <label for="" class="form-label">Número 2:</label>
  <input type="number" [(ngModel)]="num2" class="form-control" placeholder="Introducir número 2">
</div>

<button type="button" (click)="enviarRespuesta1()" class="btn btn-info">
  Enviar respuesta 1
</button>
