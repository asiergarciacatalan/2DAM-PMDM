<section class="m-5 p-6 bg-white">
  <h2 class="mb-2 text-3xl font-semibold text-gray-900">Directivas personalizadas - Ejercicio 1</h2>
  <p class="mb-12 text-lg font-medium text-gray-800">
    Pasa el ratón por encima de un alumno para resaltarlo (directiva appResalto1)
  </p>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-y-24 max-w-4xl">
    @for (alumno of alumnos; track $index) {
    <!-- La directiva se aplica a cada tarjeta -->
    <div appResaltado="yellow" colorTexto="white" class="flex flex-col items-center text-center p-4 rounded-2xl cursor-pointer shadow-md hover:shadow-lg transition-shadow duration-300">
      <img [src]="alumno.img" [alt]="alumno.nombre + ' ' + alumno.apellido" referrerpolicy="no-referrer"
        class="w-[150px] h-[150px] rounded-2xl object-cover mb-6">
      <h3 class="text-xl font-medium text-gray-900">{{ alumno.nombre }} {{ alumno.apellido }}</h3>
      <p class="text-sm font-medium text-gray-800">{{ alumno.email }}</p>
    </div>
    }
  </div>
</section>
